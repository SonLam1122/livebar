  <!-- 3. FISH TANK CONFIG -->
  <div id="config-section-fishtank" class="hidden space-y-6">
        <div class="flex items-start justify-between border-b border-slate-800 pb-4">
          <div>
            <h3 class="text-base font-bold text-teal-400 flex items-center gap-2">
              <span>🐟</span> Cấu hình Cá Lớn Nuốt Cá Bé
            </h3>
            <p class="text-xs text-slate-400 mt-0.5">Số lượng cá, cấp độ tối đa, sự xuất hiện của Cá Mập Khổng Lồ và Bão Săn Mồi.</p>
          </div>
          <button class="btn-save-config px-5 py-2.5 rounded-xl text-xs font-bold bg-teal-600 hover:bg-teal-500 text-white shadow-lg shadow-teal-600/30 transition-all shrink-0">
            💾 Lưu cấu hình
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Số cá tối đa trong hồ</label>
            <input type="number" id="cfg-fish-max" value="40" min="4" max="120" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Cấp độ cá tối đa</label>
            <input type="number" id="cfg-fish-max-level" value="8" min="2" max="12" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Tốc độ bơi</label>
            <input type="number" step="0.1" id="cfg-fish-speed" value="1.0" min="0.3" max="2.5" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Khoảng cách xuất hiện Cá Mập (Phút)</label>
            <input type="number" id="cfg-fish-shark-min" value="5" min="1" max="60" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Thời gian bão săn mồi (Giây)</label>
            <input type="number" id="cfg-fish-frenzy-duration" value="20" min="5" max="120" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-200">Giây khiên bảo hộ</label>
            <input type="number" id="cfg-fish-invincible" value="6" min="0" max="60" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-semibold text-white focus:outline-none focus:border-teal-500">
          </div>
        </div>
      </div>
